# Gradle
# -Djava.net.preferIPv4Stack=true is required on this machine: IPv6 routes to
# Maven Central / maven.neoforged.net are blackholed and reset the connection.
# NOTE: maven.neoforged.net is currently unreachable from here entirely, so build with
#   --offline
# against the toolchain cache (.toolchain/gh). See README.md.
org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment (parameter names / javadoc)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.250
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Mod properties
mod_id=mending_forger_fix
mod_name=Mending Forger Fix
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.mendingfix
mod_authors=mending_forger_fix
mod_description=Re-allows the Create: Enchantment Industry Blaze Forger to upgrade enchantments that CEI hard-caps at level 1 (Mending by default) via its enchantment_processing/rules data map.

# Dependency versions matching the target instance
create_version=6.0.10-281
registrate_version=MC1.21-1.3.0+67
ponder_version=1.0.82
flywheel_version=1.0.6
